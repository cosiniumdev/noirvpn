# A typical OpenVPN 2.4 server config as found in tutorials. Most of it does
# not work in noirvpn; --check-config should say why, line by line.
port 1194
proto udp
dev tun
ca ca.crt
cert server.crt
key server.key
dh dh2048.pem
topology net30
server 10.8.0.0 255.255.255.0
ifconfig-pool-persist ipp.txt
push "redirect-gateway def1 bypass-dhcp"
push "dhcp-option DNS 208.67.222.222"
keepalive 10 120
tls-auth ta.key 0
cipher AES-256-CBC
auth SHA256
comp-lzo
push "comp-lzo"
user nobody
group nogroup
persist-key
persist-tun
status openvpn-status.log
log-append /var/log/openvpn.log
verb 3
explicit-exit-notify 1
script-security 2
up /etc/openvpn/up.sh
client-connect /etc/openvpn/connect.sh
management localhost 7505
plugin /usr/lib/openvpn/openvpn-plugin-auth-pam.so login
tls-cipher TLS-ECDHE-RSA-WITH-AES-256-GCM-SHA384
fragment 1300
daemon
no-such-option 1
