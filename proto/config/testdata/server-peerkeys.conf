# A noirvpn server that knows its clients by public key.
local 0.0.0.0 1194 udp
local :: 1194 udp6
local 0.0.0.0 443 tcp-server
dev tun
topology subnet
server 10.8.0.0 255.255.255.0
server-ipv6 fd00:8::/64

cert /etc/noirvpn/server.crt
key /etc/noirvpn/server.key
tls-crypt-v2 /etc/noirvpn/tls-crypt-v2-server.key force-cookie
tls-crypt-v2-max-age 365

peer-keys /etc/noirvpn/peers
client-config-dir /etc/noirvpn/ccd
client-to-client

keepalive 10 60
push "route 192.168.50.0 255.255.255.0"
push "dns server 0 address 10.8.0.1"
push "dns search-domains corp.example"
data-ciphers AES-256-GCM:AES-128-GCM:CHACHA20-POLY1305
tls-version-min 1.3
pq-mode prefer
reneg-sec 3600
max-clients 200
explicit-exit-notify 1
user noirvpn
group noirvpn
verb 3

workers 0
datapath auto
bus-events /run/noirvpn/events mode 640 group noirvpn
bus-control /run/noirvpn/control mode 660 group noirvpn
bus-allow uid 0 admin
bus-allow gid noirvpn read,operator
