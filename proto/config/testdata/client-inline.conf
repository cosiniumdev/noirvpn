# Client with everything inline: CA, certificate, key and a tls-crypt-v2
# client key. The key text below is made up; the config parser only keeps it.
client
dev tun
proto udp
remote vpn.example.com 1194
remote-random
resolv-retry infinite
nobind

remote-cert-tls server
data-ciphers AES-256-GCM:CHACHA20-POLY1305
tls-version-min 1.3
reneg-sec 0
verb 3

<ca>
-----BEGIN CERTIFICATE-----
MIIBdummydummydummydummydummydummydummydummydummydummydummydummyAAAA
dummydummydummydummydummydummydummydummydummydummydummydummyBBBB==
-----END CERTIFICATE-----
</ca>
<cert>
-----BEGIN CERTIFICATE-----
MIIBclientclientclientclientclientclientclientclientclientclientCCCC
-----END CERTIFICATE-----
</cert>
<key>
-----BEGIN PRIVATE KEY-----
MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQgdummydummydummyDDDD
-----END PRIVATE KEY-----
</key>
<tls-crypt-v2>
-----BEGIN OpenVPN tls-crypt-v2 client key-----
dGhpcyBpcyBub3QgYSByZWFsIGtleSwganVzdCBhIHRlc3QgZmlsZSBmb3IgdGhlIHBhcnNlcg==
-----END OpenVPN tls-crypt-v2 client key-----
</tls-crypt-v2>
