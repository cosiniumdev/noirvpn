name: Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  # release.yml runs this workflow to build the release archives.
  workflow_call:

permissions:
  contents: read

env:
  # The code needs an Odin nightly of 2026-11-15 or later (build/README.md).
  # No GitHub release has it yet (dev-2026-11a is too old), so the compiler is
  # built from this commit and cached. Change it together with build/README.md.
  ODIN_COMMIT: ece728cb96f67000e7d6e7105e70e26d11c26186
  # The LLVM of the Odin compiler on Linux and macOS (Odin supports 17 to 22).
  ODIN_LLVM: "20"
  # The Windows tunnel driver that dist.sh puts next to noirvpn.exe.
  WINTUN_VERSION: 0.14.1
  WINTUN_SHA256: 07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      # Linux (Ubuntu 26.04): OpenSSL 3, nng 1.x, SDL3, and LLVM for Odin.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y make clang llvm-$ODIN_LLVM-dev \
            libssl-dev libnng-dev libsdl3-dev

      # macOS: SDL3 and OpenSSL from Homebrew, cmake for build/macos-nng.sh,
      # LLVM for Odin (the compiler links libLLVM dynamically).
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install sdl3 openssl@3 cmake llvm@$ODIN_LLVM

      # Windows: the build scripts run in the MSYS2 MINGW64 shell, with the
      # OpenSSL DLLs of MSYS2. SDL3 comes with Odin (vendor/sdl3).
      - name: Setup MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          update: false
          install: make mingw-w64-x86_64-openssl

      - name: Restore Odin
        id: odin-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/odin
          key: odin-${{ runner.os }}-${{ runner.arch }}-${{ env.ODIN_COMMIT }}-llvm${{ env.ODIN_LLVM }}

      - name: Fetch Odin source
        if: steps.odin-cache.outputs.cache-hit != 'true'
        run: |
          git init -q "$RUNNER_TEMP/odin"
          cd "$RUNNER_TEMP/odin"
          git remote add origin https://github.com/odin-lang/Odin
          git fetch -q --depth=1 origin "$ODIN_COMMIT"
          git checkout -q FETCH_HEAD
          # SDL3.dll and SDL3.lib are in Git LFS; the desktop client needs them
          # on Windows.
          if [ "$RUNNER_OS" = Windows ]; then
            git lfs install --local
            git lfs pull --include="vendor/sdl3/*"
          fi

      - name: Build Odin (Linux, macOS)
        if: steps.odin-cache.outputs.cache-hit != 'true' && runner.os != 'Windows'
        working-directory: ${{ runner.temp }}/odin
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            export LLVM_CONFIG="$(brew --prefix llvm@$ODIN_LLVM)/bin/llvm-config"
          else
            export LLVM_CONFIG=llvm-config-$ODIN_LLVM
          fi
          ./build_odin.sh release
          # The stb libraries of the desktop client (macOS and Windows have
          # them in the repository; the nightly archives build them on Linux).
          if [ "$RUNNER_OS" = Linux ]; then
            sh vendor/stb/src/build_stb.sh unix
          fi

      - name: Build Odin (Windows)
        if: steps.odin-cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        working-directory: ${{ runner.temp }}/odin
        shell: cmd
        run: build.bat release

      - name: Add Odin to PATH
        run: |
          echo "$RUNNER_TEMP/odin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/odin/odin" version

      - name: Run tests (Linux, macOS)
        if: runner.os != 'Windows'
        run: make test

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make test

      - name: Build distribution (Linux, macOS)
        if: runner.os != 'Windows'
        run: make dist

      - name: Download wintun (Windows)
        if: runner.os == 'Windows'
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o wintun.zip "https://www.wintun.net/builds/wintun-$WINTUN_VERSION.zip"
          echo "$WINTUN_SHA256  wintun.zip" | sha256sum -c -
          unzip -q -o wintun.zip

      - name: Build distribution (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          # dist.sh copies the DLL and the LICENSE.txt of the zip.
          export WINTUN_DLL="$(cygpath -u "$RUNNER_TEMP")/wintun/bin/amd64/wintun.dll"
          make dist

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: noirvpn-${{ runner.os }}
          path: dist/

      # One archive per target, made here because artifacts lose the Unix file
      # modes: noirvpn-<version>-<os>-<arch>.tar.gz (.zip on Windows), with one
      # folder of the same name inside.
      - name: Package release archive
        run: |
          version=$(sed -n 's/^VERSION_NUMBER :: "\(.*\)"$/\1/p' cmd/noirvpn/cli.odin)
          rm -rf out/release out/stage
          mkdir -p out/release out/stage
          for d in dist/*/; do
            name=noirvpn-$version-$(basename "$d")
            cp -R "$d" "out/stage/$name"
            if [ "$RUNNER_OS" = Windows ]; then
              (cd out/stage && 7z a -tzip -bso0 "../release/$name.zip" "$name")
            else
              tar -C out/stage -czf "out/release/$name.tar.gz" "$name"
            fi
          done
          ls -l out/release

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: out/release/*
          if-no-files-found: error
