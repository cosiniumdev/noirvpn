  <title
     id="title">forward</title>
  <desc
     id="desc">A tunnel peer connects to port 8080 of the tunnel address of the client. The client opens a second connection to the web server 192.168.1.20 port 80 on its local network and copies the bytes between the two connections. In the same way, port 2222 of the tunnel address goes to the SSH server of the client host at 127.0.0.1 port 22.</desc>
