  <title
     id="title">HTTP proxy</title>
  <desc
     id="desc">The client opens TCP to the HTTP proxy and asks for a CONNECT tunnel to the server, with Basic authentication when it has a login. The proxy connects to the server and answers 200. The outer TLS then runs through the tunnel to the server with the server name as SNI, and the OpenVPN session runs inside it. The proxy only relays bytes.</desc>
