  <title
     id="title">allow-inbound</title>
  <desc
     id="desc">A tunnel peer starts a connection to port 22 of the client. Port 22 is in the allow-inbound list, so the connection passes to the SSH server. A connection to port 80 is not in the list: the client drops it and sends no reply. A connection that an application of the client starts leaves through the tunnel, and its replies pass.</desc>
